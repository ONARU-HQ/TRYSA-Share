<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Cormorant"; src: url("fonts/cg-roman.woff2") format("woff2"); font-weight: 300 700; font-style: normal; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cg-italic.woff2") format("woff2"); font-weight: 300 700; font-style: italic; }
  :root {
    --black: #080706; --ivory: #f4ecdb; --ivory-soft: rgba(244,236,219,.7);
    --gold: #c9a24c; --gold-hi: #f3dc9a;
    --foil: linear-gradient(100deg, #8a6a2a 0%, #d9b45f 22%, #fbe9b0 40%, #c49a43 58%, #f2d88f 76%, #9c7731 100%);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--black); overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--ivory);
    background: radial-gradient(700px 600px at 50% 30%, rgba(201,162,76,.16), transparent 70%), var(--black);
    font-family: "Cormorant", Georgia, serif; }
  #dust { position: absolute; inset: 0; }
  .frame { position: absolute; inset: 44px; border: 1.5px solid rgba(201,162,76,.75); }
  .frame::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(201,162,76,.32); }
  .corner { position: absolute; width: 20px; height: 20px; transform: rotate(45deg); border: 1.5px solid var(--gold); background: var(--black); }
  .c1 { top: 34px; left: 34px; } .c2 { top: 34px; right: 34px; } .c3 { bottom: 34px; left: 34px; } .c4 { bottom: 34px; right: 34px; }

  .top { position: absolute; top: 92px; left: 0; right: 0; text-align: center; }
  .mark { font-family: "Inter", sans-serif; font-weight: 600; font-size: 20px; letter-spacing: .6em; text-indent: .6em; color: var(--gold); }
  .eyebrow { margin-top: 12px; font-family: "Inter", sans-serif; font-weight: 500; font-size: 16px; letter-spacing: .34em; text-indent: .34em; text-transform: uppercase; color: var(--ivory-soft); }

  /* arched portrait */
  .arch-wrap { position: absolute; left: 50%; top: 172px; width: 560px; height: 660px; transform: translateX(-50%); }
  .arch-line { position: absolute; inset: -16px; border: 1px solid rgba(201,162,76,.45); border-radius: 296px 296px 0 0; border-bottom: 0; }
  .arch { position: absolute; inset: 0; border-radius: 280px 280px 0 0; overflow: hidden; border: 2px solid var(--gold); border-bottom: 0; }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; filter: saturate(.92) contrast(1.04); }
  .arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 52%, rgba(8,7,6,.55) 72%, var(--black) 97%); }
  .arch-wrap::after { content: ""; position: absolute; left: -40px; right: -40px; bottom: -6px; height: 190px; background: linear-gradient(180deg, transparent, var(--black) 70%); }

  .bottom { position: absolute; left: 0; right: 0; top: 700px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .foil { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .happy { font-weight: 500; font-size: 104px; line-height: .9; letter-spacing: .02em; }
  .birthday { font-style: italic; font-weight: 600; font-size: 178px; line-height: .86; padding: 0 20px 20px; margin-top: -6px; }
  .name { margin-top: 8px; font-size: 64px; font-weight: 500; letter-spacing: .04em; }
  .rule { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .rule span { width: 110px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule span:last-child { background: linear-gradient(90deg, var(--gold), transparent); }
  .rule i { width: 9px; height: 9px; transform: rotate(45deg); background: var(--gold); }
  .role { margin-top: 18px; font-style: italic; font-size: 30px; color: var(--ivory-soft); }
  .foot { position: absolute; left: 0; right: 0; bottom: 92px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .sig { font-style: italic; font-size: 32px; }
  .date { font-family: "Inter", sans-serif; font-weight: 500; font-size: 16px; letter-spacing: .42em; text-indent: .42em; text-transform: uppercase; color: var(--gold); }
</style></head>
<body><div class="card">
  <canvas id="dust" width="1080" height="1350"></canvas>
  <div class="frame"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="top"><div class="mark">TRYSA</div><div class="eyebrow">Today we celebrate</div></div>
  <div class="arch-wrap"><div class="arch-line"></div><div class="arch"><img src="yomi-portrait.jpg" alt=""></div></div>
  <div class="bottom">
    <div class="happy foil">Happy</div>
    <div class="birthday foil">Birthday</div>
    <div class="name">Yomi Onalaru</div>
    <div class="rule"><span></span><i></i><span></span></div>
    <div class="role">Our founder, the one who started it all</div>
  </div>
  <div class="foot">
    <div class="sig foil">With love, the TRYSA community</div>
    <div class="date">24 November 2026</div>
  </div>
</div>
<script>
  const c = document.getElementById('dust'), x = c.getContext('2d');
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const golds = ['#f3dc9a', '#c9a24c', '#e8c977', '#fff3cf'];
  for (let i = 0; i < 240; i++) {
    const px = r() * 1080, py = r() * 1350;
    if (Math.abs(px - 540) < 330 && py > 150 && py < 1250 && r() < .97) continue;
    x.globalAlpha = .15 + r() * .6; x.fillStyle = golds[(r() * 4) | 0];
    x.beginPath(); x.arc(px, py, .6 + r() * 2.2, 0, Math.PI * 2); x.fill();
  }
  function glint(px, py, size, a) {
    x.globalAlpha = a; x.fillStyle = '#fbe9b0'; x.beginPath();
    x.moveTo(px, py - size); x.quadraticCurveTo(px, py, px + size * .28, py);
    x.quadraticCurveTo(px, py, px, py + size); x.quadraticCurveTo(px, py, px - size * .28, py);
    x.quadraticCurveTo(px, py, px, py - size); x.fill();
    x.beginPath(); x.moveTo(px - size * .6, py); x.quadraticCurveTo(px, py, px, py - size * .16);
    x.quadraticCurveTo(px, py, px + size * .6, py); x.quadraticCurveTo(px, py, px, py + size * .16);
    x.quadraticCurveTo(px, py, px - size * .6, py); x.fill();
  }
  [[140,260,24,.9],[945,330,18,.75],[905,1080,22,.85],[170,1040,15,.7],[970,720,11,.6],[110,640,10,.5]].forEach(g => glint(...g));
</script>
</body></html>
