<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Cormorant"; src: url("fonts/cg-roman.woff2") format("woff2"); font-weight: 300 700; font-style: normal; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cg-italic.woff2") format("woff2"); font-weight: 300 700; font-style: italic; }
  :root {
    --black: #0a0907; --ivory: #f4ecdb; --ivory-soft: rgba(244,236,219,.66);
    --gold: #c9a24c; --gold-hi: #f3dc9a; --gold-lo: #8a6a2a;
    --foil: linear-gradient(100deg, #8a6a2a 0%, #d9b45f 22%, #fbe9b0 40%, #c49a43 58%, #f2d88f 76%, #9c7731 100%);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--black); overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--ivory);
    background: radial-gradient(760px 620px at 50% 44%, rgba(201,162,76,.16), transparent 70%), var(--black);
    font-family: "Cormorant", Georgia, serif; }
  #dust { position: absolute; inset: 0; }
  /* double gold frame */
  .frame { position: absolute; inset: 52px; border: 1.5px solid rgba(201,162,76,.75); }
  .frame::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(201,162,76,.35); }
  .corner { position: absolute; width: 22px; height: 22px; transform: rotate(45deg); border: 1.5px solid var(--gold); background: var(--black); }
  .c1 { top: 41px; left: 41px; } .c2 { top: 41px; right: 41px; } .c3 { bottom: 41px; left: 41px; } .c4 { bottom: 41px; right: 41px; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 150px 120px 140px; }
  .mark { font-family: "Inter", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .6em; text-indent: .6em; color: var(--gold); }
  .eyebrow { margin-top: 18px; font-family: "Inter", sans-serif; font-weight: 500; font-size: 20px; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase; color: var(--ivory-soft); }
  .foil { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .happy { margin-top: 110px; font-weight: 500; font-size: 150px; line-height: .9; letter-spacing: .02em; }
  .birthday { font-style: italic; font-weight: 600; font-size: 250px; line-height: .9; letter-spacing: -.01em; padding: 0 20px 30px; }
  .rule { display: flex; align-items: center; gap: 18px; margin-top: 46px; }
  .rule span { width: 130px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule span:last-child { background: linear-gradient(90deg, var(--gold), transparent); }
  .rule i { width: 10px; height: 10px; transform: rotate(45deg); background: var(--gold); }
  .to { margin-top: 46px; font-size: 56px; line-height: 1.15; font-weight: 500; }
  .to em { font-style: italic; }
  .msg { margin-top: 24px; max-width: 700px; font-size: 34px; line-height: 1.4; color: var(--ivory-soft); }
  .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .sig { font-style: italic; font-size: 40px; }
  .date { font-family: "Inter", sans-serif; font-weight: 500; font-size: 19px; letter-spacing: .42em; text-indent: .42em; text-transform: uppercase; color: var(--gold); }
</style></head>
<body><div class="card">
  <canvas id="dust" width="1080" height="1350"></canvas>
  <div class="frame"></div>
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <div class="content">
    <div class="mark">TRYSA</div>
    <div class="eyebrow">Today we celebrate</div>
    <div class="happy foil">Happy</div>
    <div class="birthday foil">Birthday</div>
    <div class="rule"><span></span><i></i><span></span></div>
    <div class="to">To <em>our Founder</em>,<br>the one who started it all.</div>
    <div class="msg">Thank you for the vision, the late nights, and for building a home for all of us.</div>
    <div class="foot">
      <div class="sig foil">With love, the TRYSA community</div>
      <div class="date">24 November 2026</div>
    </div>
  </div>
</div>
<script>
  // Sparse gold dust and a few four-point glints, kept away from the text column.
  const c = document.getElementById('dust'), x = c.getContext('2d');
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const golds = ['#f3dc9a', '#c9a24c', '#e8c977', '#fff3cf'];
  for (let i = 0; i < 260; i++) {
    const px = r() * 1080, py = r() * 1350;
    if (Math.abs(px - 540) < 360 && py > 120 && py < 1230 && r() < .97) continue;
    x.globalAlpha = .15 + r() * .6; x.fillStyle = golds[(r() * 4) | 0];
    x.beginPath(); x.arc(px, py, .6 + r() * 2.2, 0, Math.PI * 2); x.fill();
  }
  function glint(px, py, size, a) {
    x.globalAlpha = a; x.fillStyle = '#fbe9b0'; x.beginPath();
    x.moveTo(px, py - size); x.quadraticCurveTo(px, py, px + size * .28, py);
    x.quadraticCurveTo(px, py, px, py + size); x.quadraticCurveTo(px, py, px - size * .28, py);
    x.quadraticCurveTo(px, py, px, py - size); x.fill();
    x.beginPath(); x.moveTo(px - size * .6, py); x.quadraticCurveTo(px, py, px, py - size * .16);
    x.quadraticCurveTo(px, py, px + size * .6, py); x.quadraticCurveTo(px, py, px, py + size * .16);
    x.quadraticCurveTo(px, py, px - size * .6, py); x.fill();
  }
  [[150,250,26,.9],[930,330,18,.75],[880,1060,24,.85],[190,1010,16,.7],[960,700,12,.6],[120,640,10,.5],[800,180,10,.55]].forEach(g => glint(...g));
</script>
</body></html>
