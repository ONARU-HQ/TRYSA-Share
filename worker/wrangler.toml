name = "trysa-share"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Installable web app (served under /share/). The Worker runs first so it can add security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Expiry + storage cleanup every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
SUPABASE_URL = "https://ccaxvjrgjpaixvyrgizn.supabase.co"
# Public publishable (anon) key – safe for browsers. Set before deploying.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IkJo_XT6St7PWGeMryVJNw_pXbP2w3W"
PUBLIC_BASE_URL = "https://link.trysa.app"
ALLOWED_ORIGINS = "https://link.trysa.app,https://trysa.app,https://app.trysa.app"
BUCKET = "trysa-share-private"
# SUPABASE_SERVICE_ROLE_KEY is a secret:  wrangler secret put SUPABASE_SERVICE_ROLE_KEY

# Cloudflare rate limiting binding (per-IP, per-route-class).
[[ratelimits]]
name = "SHARE_RL"
namespace_id = "7201"
simple = { limit = 120, period = 60 }

# IMPORTANT: routes are scoped to /s/*, /share* and /api/share/* only, so existing
# permanent QR paths such as link.trysa.app/hicc-gallery never reach this Worker.
# Production routes are intentionally commented out until staging sign-off.
# routes = [
#   { pattern = "link.trysa.app/s/*", zone_name = "trysa.app" },
#   { pattern = "link.trysa.app/share*", zone_name = "trysa.app" },
#   { pattern = "link.trysa.app/api/share/*", zone_name = "trysa.app" },
# ]

[env.staging]
name = "trysa-share-staging"
# PUBLIC_BASE_URL / ALLOWED_ORIGINS default to the workers.dev address the Worker is served from.
vars = { SUPABASE_URL = "https://ccaxvjrgjpaixvyrgizn.supabase.co", SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IkJo_XT6St7PWGeMryVJNw_pXbP2w3W", BUCKET = "trysa-share-private" }

[[env.staging.ratelimits]]
name = "SHARE_RL"
namespace_id = "7202"
simple = { limit = 120, period = 60 }

# TRYSA Nearby: one Durable Object per local network (presence + WebRTC signalling only).
[[durable_objects.bindings]]
name = "NEARBY"
class_name = "NearbyRoom"

[[migrations]]
tag = "v1-nearby"
new_sqlite_classes = ["NearbyRoom"]

[[env.staging.durable_objects.bindings]]
name = "NEARBY"
class_name = "NearbyRoom"
